<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;

    background: linear-gradient(rgba(0, 4, 30, 0.9), rgba(0, 7, 56, 0.9)),
                url("img/ilustracao-vetorial-de-tecnologias-modernas-de-transmissao-de-informacao-digital-esboco-para-criatividade_1028306-1268.jpg");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

h1 {
    margin-top: 30px;
}

h2 {
    color: #d4af37;
}


.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 25px;
    padding: 20px;
}


.card {
    width: 180px;
    background: white;
    border-radius: 12px;
    border: 2px solid #d4af37;
    padding: 10px;
    transition: 0.4s;
    opacity: 0;
    transform: translateY(30px);
    animation: subir 0.6s ease forwards;
}


.card.grande {
    width: 220px;
}


.foto {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 8px;
    border: 2px solid #d4af37;
}


.nome {
    margin-top: 10px;
    font-weight: bold;
    color: #020a4a;
}

.cargo {
    display: inline-block;
    margin-top: 5px;
    background: #d4af37;
    color: #020a4a;
    padding: 5px 10px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: bold;
}


.redes {
    margin-top: 10px;
    display: flex;
    justify-content: center;
    gap: 10px;
}

.redes a {
    background: #020a4a;
    color: white;
    padding: 6px;
    border-radius: 50%;
    transition: 0.3s;
}

.redes a:hover {
    background: #d4af37;
    color: #020a4a;
}


.card:hover {
    transform: translateY(-10px) scale(1.05);
    box-shadow: 0 10px 25px rgba(212, 175, 55, 0.5);
}


@keyframes subir {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.diretoria {
    margin-bottom: 50px;
}

</style>
</head>
